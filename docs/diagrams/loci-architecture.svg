<g><rect x="385" y="355" width="310" height="100" rx="16" fill="#fffaf1" class="box ext"/><rect x="385" y="355" width="310" height="100" rx="16" fill="url(#hatch)"/><text x="540" y="379" class="body"><tspan x="540">Planning adapters · online</tspan><tspan x="540" dy="22">Overpass / OSM places</tspan><tspan x="540" dy="22">Vercel → Gemini / Gemma 4</tspan><tspan x="540" dy="22">Intent + story · server key</tspan></text></g>
<g><rect x="785" y="355" width="235" height="85" rx="16" fill="#f4d6a0" class="box"/><rect x="785" y="355" width="235" height="85" rx="16" fill="url(#hatch)"/><text x="902" y="388" class="body"><tspan x="902">Prepared course</tspan><tspan x="902" dy="24">Local on phone</tspan></text></g>
