<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="520" viewBox="0 0 1450 520" role="img" aria-labelledby="title desc"><title id="title">Loci architecture</title><desc id="desc">Hand-authored SVG rendition, not a native Excalidraw export. Editable source: loci-architecture.excalidraw. Planning is online; prepared run is local.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V9" stroke="#5c6876" stroke-opacity=".14" stroke-width="1.5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b16e46"/></marker><marker id="local" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#528b70"/></marker><style>text{font-family:'Comic Sans MS','Segoe Print',cursive;fill:#20283a}.title{font-size:32px}.lane{font-size:16px;fill:#566174}.body{font-size:17px;text-anchor:middle}.small{font-size:14px;text-anchor:middle;fill:#566174}.box{stroke:#334155;stroke-width:2}.ext{stroke:#82613e}.arrow{fill:none;stroke:#b16e46;stroke-width:2.5;marker-end:url(#arrow)}.local{fill:none;stroke:#528b70;stroke-width:2.5;marker-end:url(#local)}</style></defs><rect width="1450" height="520" fill="#f8f5ec"/><text x="70" y="75" class="title">LOCI / Plan online. Remember, then walk.</text><text x="70" y="125" class="lane">PLANNING · create and memorize a course</text><text x="70" y="325" class="lane">RUN · prepared course drives local GPS checkpoints</text>
<g><rect x="70" y="155" width="230" height="110" rx="16" fill="#f4d6a0" class="box"/><rect x="70" y="155" width="230" height="110" rx="16" fill="url(#hatch)"/><text x="185" y="185" class="body"><tspan x="185">REQUEST + GPS</tspan><tspan x="185" dy="24">Intent</tspan><tspan x="185" dy="24">Starting point</tspan></text></g>
<g><rect x="385" y="145" width="310" height="130" rx="16" fill="#c5dfd1" class="box"/><rect x="385" y="145" width="310" height="130" rx="16" fill="url(#hatch)"/><text x="540" y="169" class="body"><tspan x="540">Plan route · TypeScript</tspan><tspan x="540" dy="22">Validate intent + loop</tspan><tspan x="540" dy="22">Select real landmarks</tspan><tspan x="540" dy="22">Create memory story</tspan><tspan x="540" dy="22">Fallback: cache/template</tspan></text></g>
